name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref}}
    cancel-in-progress: true

jobs:
    unit:
        name: Unit tests (Vitest)
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-node@v4
                with:
                    node-version: 20
                    cache: npm
            -   run: npm ci
            # vitest.config.ts — lib/**/*.test.ts, no DB, no setupFiles. Safe to
            # run with no secrets at all.
            -   run: npm test

    integration:
        name: Integration tests (Nitest + Neon test branch)
        runs-on: ubuntu-latest
        needs: unit
        env:
            DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
            NEON_BRANCH: test
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-node@v4
                with:
                    node-version: 20
                    cache: npm
            -   run: npm ci
            -   run: npm run test:integration

    e2e:
        name: E2E tests (Playwright + Neon test branch)
        runs-on: ubuntu-latest
        if: github.event_name == 'pull-request'
        needs: integration
        env:
            DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
            NEON_BRANCH: test
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-node@v4
                with:
                    node-version: 20
                    cache: npm
            -   run: npm ci
            -   run: npx playwright install --with-depschromuim
            -   run: npm run test:e2e
            -   name: Upload Playwright report
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: playwright-report
                    path: playwright-report/
                    retention-days: 14
